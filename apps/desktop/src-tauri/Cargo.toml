[package]
name = "storia-studio-desktop"
version = "0.2.1"
description = "Storia Studio — Native Cross-Platform 2D & Retro NLE Desktop App, Installer & Launcher"
authors = ["Mairon Mayorga"]
edition = "2021"
rust-version = "1.77"
default-run = "storia-studio"

[lib]
name = "storia_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "storia-studio"
path = "src/main.rs"

[[bin]]
name = "storia-launcher"
path = "src/bin/storia-launcher.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = false
