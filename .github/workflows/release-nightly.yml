name: Release Nightly Desktop (Auto on master push)

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: storia-nightly-desktop-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-nightly:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip nightly]') &&
       !contains(github.event.head_commit.message, '[skip release]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_label: windows-x64
            target: x86_64-pc-windows-msvc
            launcher_ext: ".exe"
          - platform: macos-latest
            os_label: macos-arm64
            target: aarch64-apple-darwin
            launcher_ext: ""
          - platform: macos-latest
            os_label: macos-x64
            target: x86_64-apple-darwin
            launcher_ext: ""
          - platform: ubuntu-22.04
            os_label: linux-x64
            target: x86_64-unknown-linux-gnu
            launcher_ext: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            ffmpeg

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Storia Studio runtime bundle (Nightly)
        env:
          STORIA_BUILD_CHANNEL: nightly
        run: node scripts/prepare-desktop-bundle.mjs

      - name: Build Tauri v2 Desktop App & OS Installers (Nightly)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORIA_BUILD_CHANNEL: nightly
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          includeDebug: false

      - name: Build standalone Rust CLI Launcher (Nightly)
        working-directory: apps/desktop/src-tauri
        env:
          STORIA_BUILD_CHANNEL: nightly
        run: cargo build --release --target ${{ matrix.target }} --bin storia-launcher

      - name: Collect Nightly installers & launcher for ${{ matrix.os_label }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-staging"
          TARGET_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "$OUT"

          shopt -s nullglob
          for f in \
            "$TARGET_DIR"/bundle/nsis/*.exe \
            "$TARGET_DIR"/bundle/msi/*.msi \
            "$TARGET_DIR"/bundle/dmg/*.dmg \
            "$TARGET_DIR"/bundle/macos/*.app.tar.gz \
            "$TARGET_DIR"/bundle/deb/*.deb \
            "$TARGET_DIR"/bundle/rpm/*.rpm \
            "$TARGET_DIR"/bundle/appimage/*.AppImage; do
            BASE="$(basename "$f" | tr ' ' '-')"
            cp "$f" "$OUT/nightly-${BASE}"
          done

          if [ "${{ matrix.os_label }}" = "linux-x64" ]; then
            tar -czf "$OUT/storia-runtime-nightly.tar.gz" -C apps/desktop/src-tauri/resources/runtime .
          fi

          LAUNCHER_SRC="$TARGET_DIR/storia-launcher${{ matrix.launcher_ext }}"
          if [ -f "$LAUNCHER_SRC" ]; then
            cp "$LAUNCHER_SRC" "$OUT/storia-launcher-nightly-${{ matrix.os_label }}${{ matrix.launcher_ext }}"
          fi

          ls -lh "$OUT"

      - name: Upload Nightly ${{ matrix.os_label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: storia-studio-nightly-${{ matrix.os_label }}
          path: release-staging/*
          if-no-files-found: error

  publish-nightly-release:
    needs: build-nightly
    if: >-
      success() && (
        github.event_name == 'workflow_dispatch' ||
        (!contains(github.event.head_commit.message, '[skip nightly]') &&
         !contains(github.event.head_commit.message, '[skip release]'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all Nightly build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest-nightly.json & SHA256SUMS.txt
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          node scripts/generate-release-manifest.mjs \
            --dir release-assets \
            --channel nightly \
            --tag nightly \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --message "$COMMIT_MSG"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          cat release-assets/latest-nightly.json

      - name: Move rolling nightly tag to latest master commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${{ github.sha }}"
          git push -f origin refs/tags/nightly

      - name: Clean stale assets from existing nightly release (prevents duplicates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1; then
            OLD_ASSETS="$(gh release view nightly --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
            for asset in $OLD_ASSETS; do
              if [ ! -f "release-assets/$asset" ]; then
                gh release delete-asset nightly "$asset" --repo "${{ github.repository }}" --yes || true
              fi
            done
          fi

      - name: Publish / Update Rolling Nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Storia Studio Nightly (${{ steps.manifest.outputs.short_sha }})
          body: |
            Compilación automática **Nightly** desde `${{ github.ref_name }}`.

            - **Commit:** `${{ github.sha }}`
            - **Cambio:** ${{ steps.manifest.outputs.commit_msg }}
            - **Auto-actualización:** En Storia Studio ve a **Ajustes › Actualizaciones** y selecciona el canal **Nightly** para recibir e instalar cada nuevo commit automáticamente.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
