[package]
name = "storia-studio-desktop"
version = "0.2.0"
description = "Storia Studio — Native Cross-Platform 2D & Retro NLE Desktop App, Installer & Launcher"
authors = ["Mairon Mayorga"]
edition = "2021"
rust-version = "1.77"
default-run = "storia-studio"

[lib]
name = "storia_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "storia-studio"
path = "src/main.rs"

[[bin]]
name = "storia-launcher"
path = "src/bin/storia-launcher.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
