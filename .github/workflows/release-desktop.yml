name: Release Stable Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable tag name (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"
      publish_release:
        description: "Publish GitHub Release with all installers & launchers"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_label: windows-x64
            target: x86_64-pc-windows-msvc
            launcher_ext: ".exe"
          - platform: macos-latest
            os_label: macos-arm64
            target: aarch64-apple-darwin
            launcher_ext: ""
          - platform: macos-latest
            os_label: macos-x64
            target: x86_64-apple-darwin
            launcher_ext: ""
          - platform: ubuntu-22.04
            os_label: linux-x64
            target: x86_64-unknown-linux-gnu
            launcher_ext: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            ffmpeg

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Storia Studio runtime bundle (Stable)
        env:
          STORIA_BUILD_CHANNEL: stable
        run: node scripts/prepare-desktop-bundle.mjs

      - name: Build Tauri v2 Desktop App & OS Installers (Stable)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORIA_BUILD_CHANNEL: stable
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          includeDebug: false

      - name: Build standalone Rust CLI Launcher (storia-launcher)
        working-directory: apps/desktop/src-tauri
        env:
          STORIA_BUILD_CHANNEL: stable
        run: cargo build --release --target ${{ matrix.target }} --bin storia-launcher

      - name: Collect installers & launcher for ${{ matrix.os_label }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-staging"
          TARGET_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "$OUT"

          shopt -s nullglob
          for f in \
            "$TARGET_DIR"/bundle/nsis/*.exe \
            "$TARGET_DIR"/bundle/msi/*.msi \
            "$TARGET_DIR"/bundle/dmg/*.dmg \
            "$TARGET_DIR"/bundle/macos/*.app.tar.gz \
            "$TARGET_DIR"/bundle/deb/*.deb \
            "$TARGET_DIR"/bundle/rpm/*.rpm \
            "$TARGET_DIR"/bundle/appimage/*.AppImage; do
            cp "$f" "$OUT/"
          done

          LAUNCHER_SRC="$TARGET_DIR/storia-launcher${{ matrix.launcher_ext }}"
          if [ -f "$LAUNCHER_SRC" ]; then
            cp "$LAUNCHER_SRC" "$OUT/storia-launcher-${{ matrix.os_label }}${{ matrix.launcher_ext }}"
          fi

          ls -lh "$OUT"

      - name: Upload ${{ matrix.os_label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: storia-studio-stable-${{ matrix.os_label }}
          path: release-staging/*
          if-no-files-found: error

  publish-stable-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (for manifest generator)
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest-stable.json & SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          node scripts/generate-release-manifest.mjs \
            --dir release-assets \
            --channel stable \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}"
          cat release-assets/latest-stable.json

      - name: Publish Stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: Storia Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
