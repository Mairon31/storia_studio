name: Build Desktop Installers & Launcher (Windows / macOS / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version label for artifact naming"
        required: false
        default: "nightly"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_label: windows-x64
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            os_label: macos-arm64
            target: aarch64-apple-darwin
          - platform: macos-13
            os_label: macos-x64
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            os_label: linux-x64
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            ffmpeg

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Storia Studio runtime bundle
        run: node scripts/prepare-desktop-bundle.mjs

      - name: Build Tauri v2 Desktop App & OS Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          includeDebug: false

      - name: Build standalone Rust CLI Launcher (storia-launcher)
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --target ${{ matrix.target }} --bin storia-launcher

      - name: Upload Desktop Installers & Launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storia-studio-${{ matrix.os_label }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/storia-launcher
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/storia-launcher.exe
          if-no-files-found: warn
